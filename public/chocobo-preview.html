<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>チョコボ・モデルスタジオ | 羽風牧場</title>
  <style>
    :root{color-scheme:dark;font-family:"Yu Gothic UI","Meiryo",sans-serif;color:#f6f1df;background:#141e1a}
    *{box-sizing:border-box}body{margin:0}button,a,input{touch-action:manipulation}button,a{font:inherit}button{cursor:pointer}
    header{height:84px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff15}
    .brand{font-size:12px;letter-spacing:.22em;color:#e4c474}.brand b{display:block;font-size:18px;color:#f6f1df;letter-spacing:.06em;margin-top:5px}
    a{color:#dfc985;text-decoration:none;font-size:13px}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:calc(100vh - 84px)}
    .stage{position:relative;min-height:640px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#344337,#17241e 75%)}
    canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}
    .caption{position:absolute;left:36px;top:32px;pointer-events:none}.eyebrow{font-size:10px;letter-spacing:.24em;color:#bca978}
    h1{font-size:30px;font-weight:500;margin:9px 0} .caption p{font-size:12px;color:#a7b5a6;margin:0}
    .view-tools{position:absolute;bottom:26px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;gap:10px}
    .view-tools span{font-size:11px;color:#b3bfaf}.view-tools button{background:#17221dbd;border:1px solid #ffffff28;color:#e9e3cc;border-radius:30px;padding:10px 17px}
    aside{padding:28px 25px;background:#19241f;border-left:1px solid #ffffff10}h2{font-size:11px;letter-spacing:.18em;color:#a8b5a6;font-weight:500;margin:0 0 14px}
    .models{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .motions{display:grid;gap:7px}.motion{display:flex;align-items:center;justify-content:space-between;text-align:left;border:1px solid #ffffff14;background:#ffffff03;color:#dddccc;padding:12px 14px;border-radius:7px;font-size:13px}
    .motion small{font-size:10px;color:#a3b1a1}.motion[aria-pressed=true]{background:#ddbb7018;border-color:#d2af63;color:#f4d58d}.motion[aria-pressed=true] small{color:#f4d58d}
    .section{margin-top:24px}.colors{display:flex;flex-wrap:wrap;gap:9px}.swatch{width:29px;height:29px;border-radius:50%;background:var(--color);border:3px solid #19241f;outline:1px solid #ffffff22}.swatch[aria-pressed=true]{outline:2px solid #efdcab}
    .swatch-label{font-size:11px;color:#aebba9;margin:8px 0 0}
    label{font-size:12px;color:#c8cfbf;display:flex;justify-content:space-between;margin-bottom:12px}input[type=range]{width:100%;accent-color:#d3b468}
    #description{font-size:12px;line-height:1.9;color:#aebba9;min-height:69px}.downloads{display:flex;gap:9px;margin-top:16px}.downloads a{flex:1;text-align:center;padding:11px 4px;border:1px solid #b99e5f55;border-radius:5px}
    .meta{font-size:10px;line-height:1.9;color:#849580;margin-top:18px}.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px;background:#15221fe8;border-radius:8px;font-size:13px;max-width:80%}
    [hidden]{display:none!important}
    @media(max-width:800px){header{height:70px}main{grid-template-columns:1fr}.stage{min-height:64vh}aside{border-left:0;padding:24px}.motions{grid-template-columns:1fr 1fr}.caption{left:22px;top:23px}h1{font-size:24px}.view-tools{left:20px;right:20px}.view-tools span{max-width:155px;line-height:1.8}}
  </style>
  <script src="/js/ranch-genetics.js"></script>
  <script type="importmap">{"imports":{"three":"/vendor/three/three.module.js"}}</script>
</head>
<body>
  <header><div class="brand">WING & WIND<b>羽風牧場 / MODEL STUDIO</b></div><a href="/">牧場に戻る ↗</a></header>
  <main>
    <section class="stage" id="stage" aria-label="回転・拡大できるチョコボの3Dプレビュー">
      <div class="caption"><div class="eyebrow" id="eyebrow">RACER No. 03 / ANIMATED MODEL</div><h1 id="headline">翼をたたみ、風を待つ。</h1><p id="mode-label"></p></div>
      <div id="status" class="status" role="status">3Dモデルを読み込んでいます…</div>
      <div class="view-tools"><span>ドラッグで回転 · スクロールで拡大</span><div><button id="reset">視点を戻す</button> <button id="pause" aria-pressed="false">一時停止</button></div></div>
    </section>
    <aside>
      <h2>00 / モデル</h2>
      <div class="models" id="models">
        <button class="motion" data-model="v3" aria-pressed="true">第3版<small>ステイリオン型</small></button>
        <button class="motion" data-model="v2" aria-pressed="false">第2版<small>まる型</small></button>
      </div>
      <div class="section"><h2>01 / 走り方</h2><div class="motions" id="motions"></div>
      <p id="description"></p></div>
      <div class="section"><h2>02 / 羽色</h2><div class="colors" id="plumage"></div><p class="swatch-label" id="plumage-label"></p></div>
      <div class="section" id="crest-section"><h2>03 / 額羽</h2><div class="colors" id="crest"></div><p class="swatch-label" id="crest-label"></p></div>
      <div class="section"><label for="speed">再生速度 <output id="speed-value">1.00 ×</output></label><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1"></div>
      <div class="section"><h2>04 / モデルを使う</h2><div class="downloads"><a id="glb-link" download>GLB ↓</a><a id="blend-link" download>Blender ↓</a></div><p class="meta" id="meta"></p></div>
    </aside>
  </main>
  <script type="module" src="/js/chocobo-preview.js"></script>
</body>
</html>
