<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>シロマ — 表情差分</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e9;color:#403b45;font-family:system-ui,sans-serif;padding:32px}main{max-width:1300px;margin:auto}h1{font-size:28px;margin:0 0 10px}p{color:#706675}nav{display:flex;gap:10px;margin:22px 0}button{padding:9px 18px;border:1px solid #bdb5bd;border-radius:9px;background:white;color:#403b45;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}figure{margin:0;border:1px solid #d9d1d6;border-radius:14px;overflow:hidden;background:#fff}.portrait{background-color:#e5e5e5;background-image:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0);background-size:24px 24px}img{display:block;width:100%;height:auto}figcaption{padding:14px 18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}a{font-size:12px;color:#886373;font-weight:400}body[data-bg="dark"] .portrait{background:#25303b}body[data-bg="light"] .portrait{background:#fff}@media(max-width:760px){body{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}figcaption{padding:10px;font-size:13px}}
</style>
<main><h1>シロマ — 表情差分</h1><p>白いローブ・ピンク髪・青い目の秘書。1024 × 1536 px / 透過PNG / 全8種類</p>
